# Local and single-VPS stack: data services plus the server and storefront roles of one image. The api's
# published port binds to API_BIND_ADDR, the storefront's to STOREFRONT_BIND_ADDR, every other one to
# DATA_BIND_ADDR (all 127.0.0.1 by default).
# Needs Docker Compose >= 2.23.1 for `configs.content`.
name: ${COMPOSE_PROJECT_NAME:-cod}

# The server roles share one image and one environment; no env_file, so nothing leaks in unlisted.
# APP_ENV comes from .env (development when copied from .env.example); without it, it falls back to
# production, where loadEnv refuses the placeholders and needs real secrets. P3.S5 decides how a
# production .env is produced.
x-app: &app
  build:
    context: .
    args:
      # Namespaces the storefront's cache keys and assets: export the commit id before building
      # (verify-stack does). A bare rebuild reuses `local` and must flush the `next:*` keys in Valkey.
      NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
  image: ${APP_IMAGE:-cod-platform:local}
  environment: &app-env
    TZ: UTC
    APP_ENV: ${APP_ENV:-production}
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
    DATABASE_URL_DIRECT: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    REDIS_URL: redis://valkey:6379
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.invalid}
    S3_ENDPOINT: http://garage:3900
    S3_REGION: ${S3_REGION:-garage}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
    COOKIE_SECRET: ${COOKIE_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    API_PORT: '3000'
    WORKER_HEALTH_PORT: '3020'

x-app-healthcheck: &app-healthcheck
  test: ['CMD', 'node', 'apps/server/dist/healthcheck.js']
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 30s

x-app-depends-on: &app-depends-on
  migrate:
    condition: service_completed_successfully
  pgbouncer:
    condition: service_healthy
  valkey:
    condition: service_healthy
  garage:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      # Over TCP: the image's first-boot initdb server listens on the unix socket only, so a socket check
      # would report healthy before clients on the network can connect.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: '200'
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MAX_CLIENT_CONN: '500'
      ADMIN_USERS: ${POSTGRES_USER}
      LISTEN_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${PGBOUNCER_HOST_PORT:-6432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    volumes:
      - valkeydata:/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${VALKEY_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_PRIVATE}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${GARAGE_S3_HOST_PORT:-3900}:3900'
    healthcheck:
      test: ['CMD', '/garage', 'json-api', 'GetClusterHealth']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1026}:1025'
      - '${DATA_BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs pending migrations and the idempotent platform seed, then exits; api and worker wait for it.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      ROLE: migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
    depends_on: *app-depends-on
    ports:
      - '${API_BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-3100}:3000'
    healthcheck: *app-healthcheck
    restart: unless-stopped

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      # Empty: the worker consumes every queue (ADR 0013 addendum).
      WORKER_ACTIVE_QUEUES: ${WORKER_ACTIVE_QUEUES:-}
    depends_on: *app-depends-on
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${WORKER_HEALTH_HOST_PORT:-3020}:3020'
    healthcheck: *app-healthcheck
    restart: unless-stopped

  # The Next.js storefront from the same image. It needs only Valkey (the shared cache); while Valkey is
  # down it serves uncached and /readyz stays 200 with checks.redis.ok false (plan deviation 15).
  storefront:
    <<: *app
    environment:
      TZ: UTC
      ROLE: storefront
      APP_ENV: ${APP_ENV:-production}
      REDIS_URL: redis://valkey:6379
      # Read by the proxy on each request to find the store behind a host (D12).
      INTERNAL_API_URL: http://api:3000
      # No NEXT_DEPLOYMENT_ID here: the image's ENV (from the build arg) is the only source, so the cache keys
      # always match the deployment the assets were built for.
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - '${STOREFRONT_BIND_ADDR:-127.0.0.1}:${STOREFRONT_HOST_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

configs:
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"

volumes:
  pgdata:
  valkeydata:
  garagemeta:
  garagedata:
