# Local and single-VPS stack: data services plus the server and storefront roles of one image. The api's
# published port binds to API_BIND_ADDR, the storefront's to STOREFRONT_BIND_ADDR, every other one to
# DATA_BIND_ADDR (all 127.0.0.1 by default).
# Needs Docker Compose >= 2.23.1 for `configs.content`.
name: ${COMPOSE_PROJECT_NAME:-cod}

# The server roles share one image and one environment; no env_file, so nothing leaks in unlisted.
# APP_ENV comes from .env (development when copied from .env.example) and has no fallback: loadEnv requires it
# (D400), and a deployed value needs real secrets. P3.S5 decides how a production .env is produced.
#
# COMPOSE_* variables hold an address or port as the containers see it. They have their own names because
# .env also holds the host-side values of the same settings (API_PORT=3100, INTERNAL_API_URL=http://localhost:3100)
# for processes run on the host, and verify-stack.sh exports the whole file: a shared name would hand a container
# the host's value. Unset, each one keeps the bundled service; set, it points the roles at a managed Postgres,
# Valkey or S3 (the bundled services still start: api and worker wait for them).
x-app: &app
  build:
    context: .
    args:
      # Namespaces the storefront's cache keys and assets: export the commit id before building
      # (verify-stack does). A bare rebuild reuses `local` and must flush the `next:*` keys in Valkey.
      NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-local}
      # The static files' CDN prefix; the standalone build embeds it (empty locally: served by the storefront).
      STOREFRONT_ASSET_PREFIX: ${STOREFRONT_ASSET_PREFIX:-}
  image: ${APP_IMAGE:-cod-platform:local}
  environment: &app-env
    TZ: UTC
    APP_ENV: ${APP_ENV:?set APP_ENV (development, test, staging or production)}
    DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}}
    DATABASE_URL_DIRECT: ${COMPOSE_DATABASE_URL_DIRECT:-postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}}
    DB_POOL_MAX: ${DB_POOL_MAX:-}
    REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
    PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.invalid}
    S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://garage:3900}
    S3_REGION: ${S3_REGION:-garage}
    S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE}
    # Blank falls back to S3_ENDPOINT; set it to the https address a browser reaches Garage on (production refuses an
    # http link host, D2208, D2252).
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    LINK_IMPORT_SCRAPER: ${LINK_IMPORT_SCRAPER:-}
    COOKIE_SECRET: ${COOKIE_SECRET}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
    TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
    LOG_LEVEL: ${LOG_LEVEL:-}
    # Retired by WORKER_POOL (D100): passed through only so boot refuses a value left in an old `.env`.
    WORKER_ACTIVE_QUEUES: ${WORKER_ACTIVE_QUEUES:-}
    AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET}
    INTERNAL_HMAC_KEYS: ${INTERNAL_HMAC_KEYS}
    INTERNAL_HMAC_ACTIVE_KID: ${INTERNAL_HMAC_ACTIVE_KID:-}
    # The storefront the worker revalidates after catalog and store changes, signed with the active kid (D3211).
    STOREFRONT_INTERNAL_URL: ${COMPOSE_STOREFRONT_INTERNAL_URL:-http://storefront:3001}
    TENANT_SECRET_KEKS: ${TENANT_SECRET_KEKS}
    TENANT_SECRET_ACTIVE_KID: ${TENANT_SECRET_ACTIVE_KID:-}
    QUOTE_HMAC_KEYS: ${QUOTE_HMAC_KEYS}
    QUOTE_HMAC_ACTIVE_KID: ${QUOTE_HMAC_ACTIVE_KID:-}
    PLATFORM_DEMO_HANDLERS: ${PLATFORM_DEMO_HANDLERS:-}
    AUTH_DASHBOARD_URL: ${AUTH_DASHBOARD_URL:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-}
    SMTP_FROM: ${SMTP_FROM:-}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_TLS: ${SMTP_TLS:-}
    AUTH_OAUTH_ENABLED: ${AUTH_OAUTH_ENABLED:-false}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    GOOGLE_OAUTH_AUTHORIZE_URL: ${GOOGLE_OAUTH_AUTHORIZE_URL:-}
    GOOGLE_OAUTH_TOKEN_URL: ${GOOGLE_OAUTH_TOKEN_URL:-}
    GOOGLE_OAUTH_USERINFO_URL: ${GOOGLE_OAUTH_USERINFO_URL:-}
    FACEBOOK_OAUTH_CLIENT_ID: ${FACEBOOK_OAUTH_CLIENT_ID:-}
    FACEBOOK_OAUTH_CLIENT_SECRET: ${FACEBOOK_OAUTH_CLIENT_SECRET:-}
    FACEBOOK_OAUTH_AUTHORIZE_URL: ${FACEBOOK_OAUTH_AUTHORIZE_URL:-}
    FACEBOOK_OAUTH_TOKEN_URL: ${FACEBOOK_OAUTH_TOKEN_URL:-}
    FACEBOOK_OAUTH_USERINFO_URL: ${FACEBOOK_OAUTH_USERINFO_URL:-}
    TURNSTILE_ENABLED: ${TURNSTILE_ENABLED:-false}
    TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    TURNSTILE_CHALLENGE_URL: ${TURNSTILE_CHALLENGE_URL:-}
    TURNSTILE_SITEVERIFY_URL: ${TURNSTILE_SITEVERIFY_URL:-}
    SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
    SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD}
    # The ports the roles listen on inside their containers; the published ports below follow them.
    API_PORT: ${COMPOSE_API_PORT:-3000}
    WORKER_HEALTH_PORT: ${COMPOSE_WORKER_HEALTH_PORT:-3020}
    # Observability and the CDN purge (ADR 0015, D3210), each off while blank. With the ops profile running the
    # collector (COMPOSE_PROFILES=ops), COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318 switches OTel on.
    OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
    CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
    CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}

x-app-healthcheck: &app-healthcheck
  test: ['CMD', 'node', 'apps/server/dist/healthcheck.js']
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 30s

x-app-depends-on: &app-depends-on
  migrate:
    condition: service_completed_successfully
  pgbouncer:
    condition: service_healthy
  valkey:
    condition: service_healthy
  garage:
    condition: service_healthy

services:
  postgres:
    image: postgres:17.11@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ:-UTC}
    # pg_stat_statements on every environment (ADR 0015): exact per-statement DB time, read by the dashboards and
    # scripts/ops/slow-queries.sh. The init script creates the extension on a new volume only; an existing one gets it
    # from slow-queries.sh or the runbook (CREATE EXTENSION IF NOT EXISTS).
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'pg_stat_statements.track=top']
    configs:
      - source: pg_stat_statements_sql
        target: /docker-entrypoint-initdb.d/10-pg-stat-statements.sql
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${POSTGRES_HOST_PORT:-5433}:5432'
    healthcheck:
      # Over TCP: the image's first-boot initdb server listens on the unix socket only, so a socket check
      # would report healthy before clients on the network can connect.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0@sha256:488422e38cff912895d0d65d8963fcd306e6ac589a724398b6eb8e294e94d624
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: transaction
      MAX_PREPARED_STATEMENTS: '200'
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      MAX_CLIENT_CONN: '500'
      ADMIN_USERS: ${POSTGRES_USER}
      LISTEN_PORT: '5432'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${PGBOUNCER_HOST_PORT:-6432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432']
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8.1.11@sha256:8f836008e0986c36adf50da714c7060cf689dbb335f61fe077939d90fa650809
    restart: unless-stopped
    command:
      - valkey-server
      - --maxmemory
      - ${VALKEY_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    volumes:
      - valkeydata:/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${VALKEY_HOST_PORT:-6380}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12

  garage:
    image: dxflrs/garage:v2.5.0@sha256:677e5b758e4425a325b811c425c026bf35a4bf42f7ddbaa773de3f4fd779a5a5
    restart: unless-stopped
    command: ['/garage', 'server', '--single-node', '--default-bucket']
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_DEFAULT_ACCESS_KEY: ${S3_ACCESS_KEY}
      GARAGE_DEFAULT_SECRET_KEY: ${S3_SECRET_KEY}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_PRIVATE}
    configs:
      - source: garage_toml
        target: /etc/garage.toml
    volumes:
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${GARAGE_S3_HOST_PORT:-3900}:3900'
    healthcheck:
      test: ['CMD', '/garage', 'json-api', 'GetClusterHealth']
      interval: 5s
      timeout: 3s
      retries: 12

  mailpit:
    image: axllent/mailpit:v1.33.0@sha256:9b3a463be15354c0f0eba91697d80e3e0d8a5623ef0e627cacc836bc17fd5231
    restart: unless-stopped
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1026}:1025'
      - '${DATA_BIND_ADDR:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8026}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 12

  # Runs pending migrations and the idempotent platform seed, then exits; api and worker wait for it.
  migrate:
    <<: *app
    environment:
      <<: *app-env
      ROLE: migrate
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
      # docs/ops/capacity.md: the api's pool, and the heap below the container limit (infrastructure.md node budget).
      DB_POOL_MAX: ${API_DB_POOL_MAX:-10}
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1000m
    depends_on: *app-depends-on
    ports:
      - '${API_BIND_ADDR:-127.0.0.1}:${API_HOST_PORT:-3100}:${COMPOSE_API_PORT:-3000}'
    healthcheck: *app-healthcheck
    restart: unless-stopped
    # Above the api's drain deadline (25 s requests + 5 s close, ADR 0013), so a stop never ends in SIGKILL.
    stop_grace_period: 35s

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
      # critical | bulk | all: the queue pools this worker runs (D100). One worker runs every pool at Launch.
      WORKER_POOL: ${WORKER_POOL:-all}
      # One connection per job the pool workers can run at once, plus an export's read burst (docs/ops/capacity.md).
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-66}
      NODE_OPTIONS: --max-old-space-size=768
    mem_limit: 1000m
    cpus: 1.0
    depends_on: *app-depends-on
    ports:
      - '${DATA_BIND_ADDR:-127.0.0.1}:${WORKER_HEALTH_HOST_PORT:-3020}:${COMPOSE_WORKER_HEALTH_PORT:-3020}'
    healthcheck: *app-healthcheck
    restart: unless-stopped
    # Above the worker's drain deadline (60 s jobs + 5 s close, ADR 0013).
    stop_grace_period: 75s

  # The Next.js storefront from the same image. It needs only Valkey (the shared cache); while Valkey is
  # down it serves uncached and /readyz stays 200 with checks.redis.ok false (plan deviation 15).
  storefront:
    <<: *app
    environment:
      TZ: UTC
      ROLE: storefront
      APP_ENV: ${APP_ENV:?set APP_ENV (development, test, staging or production)}
      REDIS_URL: ${COMPOSE_REDIS_URL:-redis://valkey:6379}
      # Validated at boot and read by the proxy on each request to find the store behind a host (D12).
      INTERNAL_API_URL: ${COMPOSE_INTERNAL_API_URL:-http://api:${COMPOSE_API_PORT:-3000}}
      # The storefront signs every api call with the active key (ADR 0008, D111); the api verifies with the list.
      INTERNAL_HMAC_KEYS: ${INTERNAL_HMAC_KEYS}
      INTERNAL_HMAC_ACTIVE_KID: ${INTERNAL_HMAC_ACTIVE_KID}
      # Hosts outside <label>.PLATFORM_DOMAIN get a 404 without an api call (D3214); the api's value.
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-platform.invalid}
      # The theme every store renders with, default or compact (D3207).
      STOREFRONT_THEME: ${STOREFRONT_THEME:-default}
      # Where buyers load images (D3209), the static files' CDN prefix, and whether CF-Connecting-IP is trusted (D3213;
      # required true unless APP_ENV is development or test, and only with the origin locked to Cloudflare).
      STOREFRONT_ASSET_BASE: ${STOREFRONT_ASSET_BASE:-}
      STOREFRONT_ASSET_PREFIX: ${STOREFRONT_ASSET_PREFIX:-}
      STOREFRONT_TRUST_EDGE_IP: ${STOREFRONT_TRUST_EDGE_IP:-false}
      # Required unless APP_ENV is development or test; the boot check refuses a missing or malformed one.
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:-}
      # No NEXT_DEPLOYMENT_ID here: the image's ENV (from the build arg) is the only source, so the cache keys
      # always match the deployment the assets were built for.
      # OpenTelemetry and Sentry (ADR 0015), each off while blank; the storefront has a Sentry project of its own.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${COMPOSE_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SENTRY_DSN: ${STOREFRONT_SENTRY_DSN:-}
      NODE_OPTIONS: --max-old-space-size=512
    mem_limit: 700m
    depends_on:
      valkey:
        condition: service_healthy
    ports:
      - '${STOREFRONT_BIND_ADDR:-127.0.0.1}:${STOREFRONT_HOST_PORT:-3001}:3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped
    # Same grace as the api, so a slow render is never cut by SIGKILL (scripts/ops/image-check.sh times the stop).
    stop_grace_period: 35s

  # The node's OpenTelemetry Collector (ADR 0015), only with the ops profile (COMPOSE_PROFILES=ops). It runs
  # otel/collector.yaml (debug exporter); a deployed node adds otel/collector.grafana.yaml. Nothing is published:
  # the roles reach it on the compose network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0@sha256:89107a3a8f4636a396927edf7025bb9614b8da2d92f4cc3f43109e8d115736e2
    profiles: [ops]
    restart: unless-stopped
    command: ['--config=/etc/otelcol-contrib/config.yaml']
    environment:
      COLLECTOR_REDIS_ENDPOINT: valkey:6379
      COLLECTOR_POSTGRES_ENDPOINT: postgres:5432
      COLLECTOR_POSTGRES_USER: ${POSTGRES_USER}
      COLLECTOR_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COLLECTOR_DEBUG_VERBOSITY: ${COLLECTOR_DEBUG_VERBOSITY:-basic}
    configs:
      - source: otel_collector_yaml
        target: /etc/otelcol-contrib/config.yaml
    mem_limit: 150m
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

configs:
  pg_stat_statements_sql:
    content: |
      CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
  # A copy of otel/collector.yaml with every `$` doubled for compose (otel-collector.test.ts keeps them equal).
  otel_collector_yaml:
    content: |
      # The node's OpenTelemetry Collector (ADR 0015). Everything the app roles and the storefront send passes here, is
      # scrubbed and sampled, and only then leaves the node. This file exports to the debug exporter only (local runs and
      # evidence); a deployed node merges collector.grafana.yaml on top, which adds the Grafana Cloud exporter.
      # docker-compose.yml carries a copy inline (configs.content, `$$` written `$$$$`); packages/config/tests/otel-collector.test.ts
      # keeps the two equal. Validate: scripts/ops/otel-validate.sh
      # No hostmetrics receiver: node CPU, memory and disk come from the node exporter Ansible installs (P3.S5b).
      extensions:
        health_check:
          endpoint: 0.0.0.0:13133

      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
        # Valkey memory is what the 60 % (cache writes off) and 80 % (page) alerts read (ADR 0015).
        redis:
          endpoint: $${env:COLLECTOR_REDIS_ENDPOINT}
          collection_interval: 60s
        postgresql:
          endpoint: $${env:COLLECTOR_POSTGRES_ENDPOINT}
          transport: tcp
          username: $${env:COLLECTOR_POSTGRES_USER}
          password: $${env:COLLECTOR_POSTGRES_PASSWORD}
          collection_interval: 60s
          tls:
            insecure: true

      processors:
        # Below the container's 150 MB hard limit (infrastructure.md "Launch node budget").
        memory_limiter:
          check_interval: 1s
          limit_mib: 120
          spike_limit_mib: 25
        # What may identify a buyer never leaves the node: query strings, request and response headers, client addresses
        # and SQL literals. Metric labels never carry a business, store or order id (ADR 0015 cardinality rule).
        transform/scrub:
          error_mode: ignore
          trace_statements:
            - context: span
              statements:
                - delete_key(span.attributes, "url.query")
                - replace_pattern(span.attributes["url.full"], "\\?.*$$", "")
                - replace_pattern(span.attributes["http.url"], "\\?.*$$", "")
                - replace_pattern(span.attributes["http.target"], "\\?.*$$", "")
                - delete_matching_keys(span.attributes, "^http\\.(request|response)\\.header\\..*")
                - delete_matching_keys(span.attributes, "^(client\\.address|client\\.port|net\\.peer\\.ip|http\\.client_ip|enduser\\..*)$$")
                - delete_matching_keys(span.attributes, "^db\\.(query\\.parameter\\..*|postgresql\\.values)$$")
                - replace_pattern(span.attributes["db.statement"], "'(?:[^']|'')*'", "'?'")
                - replace_pattern(span.attributes["db.query.text"], "'(?:[^']|'')*'", "'?'")
          log_statements:
            - context: log
              statements:
                - delete_key(log.attributes, "url.query")
                - delete_matching_keys(log.attributes, "^http\\.(request|response)\\.header\\..*")
                - delete_matching_keys(log.attributes, "^(client\\.address|net\\.peer\\.ip|http\\.client_ip|enduser\\..*)$$")
          metric_statements:
            - context: datapoint
              statements:
                - delete_matching_keys(datapoint.attributes, "(?i)^(business|store|order)[_.]?id$$")
                - delete_matching_keys(datapoint.attributes, "^(server\\.address|host\\.name|url\\.full|client\\.address)$$")
        # Visitor track and beacon requests (~55 % of Launch requests) are never traced and their logs stay on the node.
        filter/visitor-beacons:
          error_mode: ignore
          logs:
            log_record:
              - IsMatch(attributes["url.path"], "^/api/store/visitors/(track|beacon)")
        tail_sampling:
          decision_wait: 10s
          num_traces: 20000
          expected_new_traces_per_sec: 50
          policies:
            - name: drop-visitor-beacons
              type: drop
              drop:
                drop_sub_policy:
                  - name: beacon-route
                    type: ottl_condition
                    ottl_condition:
                      error_mode: ignore
                      span:
                        - IsMatch(attributes["url.path"], "^/api/store/visitors/(track|beacon)")
                        - IsMatch(attributes["http.target"], "^/api/store/visitors/(track|beacon)")
                        - IsMatch(attributes["http.route"], "^/api/store/visitors/(track|beacon)")
            - name: errors
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: slow
              type: latency
              latency:
                threshold_ms: 1000
            - name: ten-percent-of-the-rest
              type: probabilistic
              probabilistic:
                sampling_percentage: 10
        batch:
          timeout: 5s

      exporters:
        # basic: one line per batch; detailed (evidence runs) prints every data point.
        debug:
          verbosity: $${env:COLLECTOR_DEBUG_VERBOSITY:-basic}

      service:
        extensions: [health_check]
        pipelines:
          traces:
            receivers: [otlp]
            processors: [memory_limiter, transform/scrub, tail_sampling, batch]
            exporters: [debug]
          metrics:
            receivers: [otlp, redis, postgresql]
            processors: [memory_limiter, transform/scrub, batch]
            exporters: [debug]
          logs:
            receivers: [otlp]
            processors: [memory_limiter, transform/scrub, filter/visitor-beacons, batch]
            exporters: [debug]
  garage_toml:
    content: |
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1

      rpc_bind_addr = "[::]:3901"
      rpc_public_addr = "127.0.0.1:3901"

      [s3_api]
      s3_region = "garage"
      api_bind_addr = "[::]:3900"

      [admin]
      api_bind_addr = "[::]:3903"

volumes:
  pgdata:
  valkeydata:
  garagemeta:
  garagedata:
