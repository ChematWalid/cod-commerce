# Overlay on docker-compose.yml: Postgres with pgBackRest WAL archiving to a posix repository on a named volume
# (P3.S5a Task 7, D3507). Paths resolve against the project directory (the repo root):
#   docker compose -f docker-compose.yml -f deploy/postgres/compose.yml up -d
# then once per new data volume: docker compose exec -u postgres postgres pgbackrest --stanza=cod stanza-create
# This local repository is what scripts/ops/restore-test.sh restores from. A deployed node adds repo1 on the second
# provider from deploy/pgbackrest/pgbackrest.conf.example (P3.S5b); never R2 (ADR 0012).
services:
  postgres:
    image: cod-postgres:17.11-pgbackrest-2.60.1
    build:
      context: deploy/postgres
    environment:
      COD_WAL_ARCHIVE: ${PGBACKREST_ENABLED:-true}
      # pgBackRest connects through the local socket as the image's superuser (POSTGRES_USER), not as "postgres".
      PGBACKREST_PG1_USER: ${POSTGRES_USER}
    configs:
      - source: pgbackrest_conf
        target: /etc/pgbackrest/pgbackrest.conf
    volumes:
      - pgbackrestrepo:/var/lib/pgbackrest

configs:
  pgbackrest_conf:
    content: |
      [global]
      repo1-type=posix
      repo1-path=/var/lib/pgbackrest
      repo1-retention-full=2
      start-fast=y
      compress-type=zst
      log-level-console=info
      log-level-file=off

      [cod]
      pg1-path=/var/lib/postgresql/data

volumes:
  pgbackrestrepo:
