# Run from infra/ansible (scripts/ops/tool.sh mounts the repo and keeps the working directory).
[defaults]
inventory = inventory/staging.yml
roles_path = roles
# Pinned collections from requirements.yml first (installed by scripts/ops/ansible-check.sh, README).
collections_path = ./.ansible/collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
interpreter_python = auto_silent
callback_result_format = yaml
# Refuse unknown host keys: the first connection to a new server is accepted by hand (README).
host_key_checking = True

[ssh_connection]
pipelining = True
