- name: Fetch Cloudflare's published edge ranges
  ansible.builtin.uri:
    url: '{{ item.value }}'
    return_content: true
    timeout: 15
  loop: '{{ firewall_edge_ranges_urls | dict2items }}'
  loop_control:
    label: '{{ item.key }}'
  register: firewall_edge_fetch
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # A failed fetch falls back to the pinned copy below; the fallback is reported.
  failed_when: false

- name: Keep a fetched list only when every line is a range of its family and the list is long enough
  ansible.builtin.set_fact:
    firewall_edge_ranges_by_family: >-
      {{ firewall_edge_ranges_by_family | default({}) | combine({family: (fetched if usable else pinned)}) }}
    firewall_edge_ranges_fallbacks: >-
      {{ firewall_edge_ranges_fallbacks | default([]) + ([] if usable else [family]) }}
  vars:
    family: '{{ item.item.key }}'
    pattern: "{{ '^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$' if family == 'v4' else '^[0-9a-fA-F:]+/[0-9]{1,3}$' }}"
    fetched: "{{ (item.content | default('')).split() }}"
    pinned: "{{ lookup('ansible.builtin.file', 'cloudflare-ips-' ~ family ~ '.txt').split() }}"
    usable: >-
      {{ item.status | default(0) == 200
         and fetched | length >= firewall_edge_ranges_min[family]
         and fetched | select('match', pattern) | list | length == fetched | length }}
  loop: '{{ firewall_edge_fetch.results }}'
  loop_control:
    label: '{{ item.item.key }}'

- name: Report a fallback to the pinned ranges
  ansible.builtin.debug:
    msg: >-
      Using the pinned Cloudflare ranges for {{ firewall_edge_ranges_fallbacks | join(', ') }}: the fetch failed or
      looked wrong. Compare roles/firewall/files with https://www.cloudflare.com/ips/.
  when: firewall_edge_ranges_fallbacks | length > 0

- name: Combine the edge ranges
  ansible.builtin.set_fact:
    firewall_edge_ranges: >-
      {{ firewall_edge_ranges_by_family['v4'] + firewall_edge_ranges_by_family['v6'] + firewall_edge_ranges_extra }}
