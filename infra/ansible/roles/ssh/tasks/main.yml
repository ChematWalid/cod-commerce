- name: Install the SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present

# sshd -t needs it; systemd creates it only while the service runs.
- name: Create the privilege separation directory
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

# Debian reads sshd_config.d/*.conf in name order and the first value wins, so 00- beats a provider's or
# cloud-init's 50-cloud-init.conf that may turn passwords back on.
- name: Install the hardened sshd settings (refused unless sshd -t accepts them)
  ansible.builtin.template:
    src: 00-cod-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-cod-hardening.conf
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify:
    - Check the whole sshd configuration
    - Restart sshd
