name: Attribution

# Separate workflow so it also re-runs when the PR title/body is edited
# (editing must not leave a stale green check). Job name is a required check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: attribution-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution-check:
    name: attribution-check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Reject AI attribution in commits, PR title and body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='co-authored-by:.*(claude|anthropic)|generated with .*claude'
          found=0
          if git log --format=%B "$BASE_SHA..$HEAD_SHA" | grep -iE "$pattern"; then
            echo "::error::AI attribution found in commit messages"
            found=1
          fi
          if printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | grep -iE "$pattern"; then
            echo "::error::AI attribution found in the PR title or body"
            found=1
          fi
          exit $found
